<svg viewBox="0 0 640 140" xmlns="http://www.w3.org/2000/svg" font-family="'Segoe UI', Verdana, sans-serif">
  <defs>
    <linearGradient id="borderGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#00d9ff"/>
      <stop offset="50%" stop-color="#9d4edd"/>
      <stop offset="100%" stop-color="#ff006e"/>
    </linearGradient>
    <clipPath id="jokeClip">
      <rect x="6" y="11" width="628" height="123" rx="11"/>
    </clipPath>
  </defs>

  <rect x="2" y="2" width="636" height="136" rx="14" fill="none" stroke="url(#borderGrad)" stroke-width="2"/>
  <rect x="6" y="6" width="628" height="128" rx="11" fill="#0a0e27"/>

  <g clip-path="url(#jokeClip)">
    <!-- symmetric decorative circuit lines, mirrored left/right for balance -->
    <g opacity="0.14" stroke="#00d9ff" fill="none" stroke-width="1.3">
      <path d="M 0 20 H 70 V 5 H 150">
        <animate attributeName="stroke-dasharray" values="0,300;300,0" dur="4s" repeatCount="indefinite"/>
      </path>
      <path d="M 640 20 H 570 V 5 H 490">
        <animate attributeName="stroke-dasharray" values="0,300;300,0" dur="4s" repeatCount="indefinite"/>
      </path>
      <path d="M 0 120 H 90 V 135">
        <animate attributeName="stroke-dasharray" values="0,250;250,0" dur="4.5s" repeatCount="indefinite"/>
      </path>
      <path d="M 640 120 H 550 V 135">
        <animate attributeName="stroke-dasharray" values="0,250;250,0" dur="4.5s" repeatCount="indefinite"/>
      </path>
      <circle cx="150" cy="5" r="2.2" fill="#9d4edd" stroke="none"/>
      <circle cx="490" cy="5" r="2.2" fill="#ff006e" stroke="none"/>
    </g>

    <!-- content centered as a single block, both horizontally and vertically, equal margins on both sides -->
    <text x="320" y="60" fill="#00d9ff" font-size="16" font-weight="bold" text-anchor="middle">😄 Why do ML models love neural networks?</text>
    <text x="320" y="94" fill="#e9eef7" font-size="14.5" font-style="italic" text-anchor="middle">💡 Because they like to keep their options open-weights! ⚙️</text>
  </g>
</svg>
