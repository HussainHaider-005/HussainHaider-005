<svg viewBox="0 0 460 340" xmlns="http://www.w3.org/2000/svg" font-family="'Courier New', Consolas, monospace">
  <defs>
    <linearGradient id="borderGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#00d9ff"/>
      <stop offset="50%" stop-color="#9d4edd"/>
      <stop offset="100%" stop-color="#ff006e"/>
    </linearGradient>
    <linearGradient id="topBar" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#00d9ff"/>
      <stop offset="50%" stop-color="#9d4edd"/>
      <stop offset="100%" stop-color="#ff006e"/>
    </linearGradient>
    <!-- hard clip so absolutely nothing can ever render outside the box -->
    <clipPath id="panelClip">
      <rect x="6" y="11" width="448" height="323" rx="11"/>
    </clipPath>
    <filter id="neonGlow" x="-50%" y="-50%" width="200%" height="200%">
      <feGaussianBlur stdDeviation="4" result="blur"/>
      <feMerge><feMergeNode in="blur"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
  </defs>

  <!-- soft outer neon bloom -->
  <rect x="2" y="2" width="456" height="336" rx="14" fill="none" stroke="url(#borderGrad)" stroke-width="4" opacity="0.35" filter="url(#neonGlow)"/>
  <!-- outer glow border -->
  <rect x="2" y="2" width="456" height="336" rx="14" fill="none" stroke="url(#borderGrad)" stroke-width="2"/>
  <!-- background -->
  <rect x="6" y="6" width="448" height="328" rx="11" fill="#0a0e27"/>
  <!-- top accent bar -->
  <rect x="6" y="6" width="448" height="5" rx="2" fill="url(#topBar)"/>

  <!-- everything below is clipped to the inner box, so nothing can leak past the border -->
  <g clip-path="url(#panelClip)">

    <!-- cyberpunk digital-rain background, matching the avatar art style -->
    <g opacity="0.55">
      <text font-family="'Courier New', monospace" font-size="12" fill="#9d4edd">
        <animateTransform attributeName="transform" type="translate" values="0,-180; 0,420" dur="6.1s" begin="4.1s" repeatCount="indefinite"/>
        <tspan x="20" dy="0" opacity="1.0">イ</tspan><tspan x="20" dy="15" opacity="0.86">0</tspan><tspan x="20" dy="15" opacity="0.72">キ</tspan><tspan x="20" dy="15" opacity="0.57">カ</tspan><tspan x="20" dy="15" opacity="0.43">カ</tspan><tspan x="20" dy="15" opacity="0.29">ウ</tspan>
      </text>
      <text font-family="'Courier New', monospace" font-size="12" fill="#00d9ff">
        <animateTransform attributeName="transform" type="translate" values="0,-180; 0,420" dur="4.3s" begin="3.0s" repeatCount="indefinite"/>
        <tspan x="50" dy="0" opacity="1.0">シ</tspan><tspan x="50" dy="15" opacity="0.79">1</tspan><tspan x="50" dy="15" opacity="0.57">0</tspan><tspan x="50" dy="15" opacity="0.36">ア</tspan>
      </text>
      <text font-family="'Courier New', monospace" font-size="12" fill="#9d4edd">
        <animateTransform attributeName="transform" type="translate" values="0,-180; 0,420" dur="6.2s" begin="1.0s" repeatCount="indefinite"/>
        <tspan x="80" dy="0" opacity="1.0">オ</tspan><tspan x="80" dy="15" opacity="0.86">シ</tspan><tspan x="80" dy="15" opacity="0.72">カ</tspan><tspan x="80" dy="15" opacity="0.57">ス</tspan><tspan x="80" dy="15" opacity="0.43">キ</tspan><tspan x="80" dy="15" opacity="0.29">0</tspan>
      </text>
      <text font-family="'Courier New', monospace" font-size="12" fill="#00d9ff">
        <animateTransform attributeName="transform" type="translate" values="0,-180; 0,420" dur="3.8s" begin="0.6s" repeatCount="indefinite"/>
        <tspan x="110" dy="0" opacity="1.0">キ</tspan><tspan x="110" dy="15" opacity="0.83">ウ</tspan><tspan x="110" dy="15" opacity="0.66">オ</tspan><tspan x="110" dy="15" opacity="0.49">ケ</tspan><tspan x="110" dy="15" opacity="0.32">イ</tspan>
      </text>
      <text font-family="'Courier New', monospace" font-size="12" fill="#9d4edd">
        <animateTransform attributeName="transform" type="translate" values="0,-180; 0,420" dur="5.4s" begin="5.0s" repeatCount="indefinite"/>
        <tspan x="140" dy="0" opacity="1.0">キ</tspan><tspan x="140" dy="15" opacity="0.86">1</tspan><tspan x="140" dy="15" opacity="0.72">ス</tspan><tspan x="140" dy="15" opacity="0.57">イ</tspan><tspan x="140" dy="15" opacity="0.43">サ</tspan><tspan x="140" dy="15" opacity="0.29">ア</tspan>
      </text>
      <text font-family="'Courier New', monospace" font-size="12" fill="#00d9ff">
        <animateTransform attributeName="transform" type="translate" values="0,-180; 0,420" dur="6.9s" begin="5.1s" repeatCount="indefinite"/>
        <tspan x="170" dy="0" opacity="1.0">オ</tspan><tspan x="170" dy="15" opacity="0.83">ア</tspan><tspan x="170" dy="15" opacity="0.66">1</tspan><tspan x="170" dy="15" opacity="0.49">カ</tspan><tspan x="170" dy="15" opacity="0.32">ク</tspan>
      </text>
      <text font-family="'Courier New', monospace" font-size="12" fill="#ff006e">
        <animateTransform attributeName="transform" type="translate" values="0,-180; 0,420" dur="4.7s" begin="4.0s" repeatCount="indefinite"/>
        <tspan x="200" dy="0" opacity="1.0">キ</tspan><tspan x="200" dy="15" opacity="0.83">ス</tspan><tspan x="200" dy="15" opacity="0.66">コ</tspan><tspan x="200" dy="15" opacity="0.49">エ</tspan><tspan x="200" dy="15" opacity="0.32">コ</tspan>
      </text>
      <text font-family="'Courier New', monospace" font-size="12" fill="#ff006e">
        <animateTransform attributeName="transform" type="translate" values="0,-180; 0,420" dur="4.4s" begin="5.6s" repeatCount="indefinite"/>
        <tspan x="230" dy="0" opacity="1.0">ア</tspan><tspan x="230" dy="15" opacity="0.86">エ</tspan><tspan x="230" dy="15" opacity="0.72">カ</tspan><tspan x="230" dy="15" opacity="0.57">エ</tspan><tspan x="230" dy="15" opacity="0.43">ス</tspan><tspan x="230" dy="15" opacity="0.29">サ</tspan>
      </text>
      <text font-family="'Courier New', monospace" font-size="12" fill="#9d4edd">
        <animateTransform attributeName="transform" type="translate" values="0,-180; 0,420" dur="4.9s" begin="0.4s" repeatCount="indefinite"/>
        <tspan x="260" dy="0" opacity="1.0">カ</tspan><tspan x="260" dy="15" opacity="0.86">ケ</tspan><tspan x="260" dy="15" opacity="0.72">1</tspan><tspan x="260" dy="15" opacity="0.57">カ</tspan><tspan x="260" dy="15" opacity="0.43">1</tspan><tspan x="260" dy="15" opacity="0.29">ケ</tspan>
      </text>
      <text font-family="'Courier New', monospace" font-size="12" fill="#9d4edd">
        <animateTransform attributeName="transform" type="translate" values="0,-180; 0,420" dur="4.4s" begin="1.5s" repeatCount="indefinite"/>
        <tspan x="290" dy="0" opacity="1.0">ケ</tspan><tspan x="290" dy="15" opacity="0.86">オ</tspan><tspan x="290" dy="15" opacity="0.72">セ</tspan><tspan x="290" dy="15" opacity="0.57">サ</tspan><tspan x="290" dy="15" opacity="0.43">ス</tspan><tspan x="290" dy="15" opacity="0.29">ウ</tspan>
      </text>
      <text font-family="'Courier New', monospace" font-size="12" fill="#00d9ff">
        <animateTransform attributeName="transform" type="translate" values="0,-180; 0,420" dur="5.3s" begin="0.5s" repeatCount="indefinite"/>
        <tspan x="320" dy="0" opacity="1.0">キ</tspan><tspan x="320" dy="15" opacity="0.86">シ</tspan><tspan x="320" dy="15" opacity="0.72">サ</tspan><tspan x="320" dy="15" opacity="0.57">コ</tspan><tspan x="320" dy="15" opacity="0.43">カ</tspan><tspan x="320" dy="15" opacity="0.29">ウ</tspan>
      </text>
      <text font-family="'Courier New', monospace" font-size="12" fill="#9d4edd">
        <animateTransform attributeName="transform" type="translate" values="0,-180; 0,420" dur="4.8s" begin="3.6s" repeatCount="indefinite"/>
        <tspan x="350" dy="0" opacity="1.0">ウ</tspan><tspan x="350" dy="15" opacity="0.79">エ</tspan><tspan x="350" dy="15" opacity="0.57">シ</tspan><tspan x="350" dy="15" opacity="0.36">ア</tspan>
      </text>
      <text font-family="'Courier New', monospace" font-size="12" fill="#00d9ff">
        <animateTransform attributeName="transform" type="translate" values="0,-180; 0,420" dur="4.5s" begin="0.9s" repeatCount="indefinite"/>
        <tspan x="380" dy="0" opacity="1.0">キ</tspan><tspan x="380" dy="15" opacity="0.86">0</tspan><tspan x="380" dy="15" opacity="0.72">イ</tspan><tspan x="380" dy="15" opacity="0.57">キ</tspan><tspan x="380" dy="15" opacity="0.43">ケ</tspan><tspan x="380" dy="15" opacity="0.29">イ</tspan>
      </text>
      <text font-family="'Courier New', monospace" font-size="12" fill="#00d9ff">
        <animateTransform attributeName="transform" type="translate" values="0,-180; 0,420" dur="6.4s" begin="3.0s" repeatCount="indefinite"/>
        <tspan x="410" dy="0" opacity="1.0">キ</tspan><tspan x="410" dy="15" opacity="0.86">ソ</tspan><tspan x="410" dy="15" opacity="0.72">エ</tspan><tspan x="410" dy="15" opacity="0.57">ソ</tspan><tspan x="410" dy="15" opacity="0.43">イ</tspan><tspan x="410" dy="15" opacity="0.29">ク</tspan>
      </text>
      <text font-family="'Courier New', monospace" font-size="12" fill="#00d9ff">
        <animateTransform attributeName="transform" type="translate" values="0,-180; 0,420" dur="5.6s" begin="2.9s" repeatCount="indefinite"/>
        <tspan x="440" dy="0" opacity="1.0">コ</tspan><tspan x="440" dy="15" opacity="0.79">エ</tspan><tspan x="440" dy="15" opacity="0.57">ソ</tspan><tspan x="440" dy="15" opacity="0.36">0</tspan>
      </text>
    </g>

    <!-- header row -->
    <circle cx="28" cy="34" r="5" fill="#00ff88">
      <animate attributeName="opacity" values="1;0.3;1" dur="2s" repeatCount="indefinite"/>
    </circle>
    <text x="42" y="39" fill="#00d9ff" font-size="14" font-weight="bold" letter-spacing="0.5">SYSTEM://HUSSAIN_HAIDER</text>
    <text x="434" y="39" fill="#7a7f9e" font-size="11" text-anchor="end">STATUS: ONLINE</text>

    <line x1="26" y1="50" x2="434" y2="50" stroke="#232e42" stroke-width="1"/>

    <!-- two-column info grid: fills the FULL width, no dead space on either side -->
    <!-- left column -->
    <text x="26" y="76"  fill="#ff006e" font-size="11.5" font-weight="bold">ROLE</text>
    <text x="26" y="93" fill="#e9eef7" font-size="12">AI Developer</text>
    <text x="26" y="108" fill="#e9eef7" font-size="12">ML Engineer</text>

    <text x="26" y="136" fill="#ff006e" font-size="11.5" font-weight="bold">SPEC</text>
    <text x="26" y="153" fill="#e9eef7" font-size="12">Builder +</text>
    <text x="26" y="168" fill="#e9eef7" font-size="12">Deployer</text>

    <text x="26" y="196" fill="#00d9ff" font-size="11.5" font-weight="bold">LANG</text>
    <text x="26" y="213" fill="#e9eef7" font-size="12">Python · TS</text>
    <text x="26" y="228" fill="#e9eef7" font-size="12">JS · C++</text>

    <!-- vertical divider between columns -->
    <line x1="230" y1="60" x2="230" y2="238" stroke="#232e42" stroke-width="1"/>

    <!-- right column -->
    <text x="245" y="76"  fill="#9d4edd" font-size="11.5" font-weight="bold">EDU</text>
    <text x="245" y="93" fill="#e9eef7" font-size="12">BS AI @ UMT</text>
    <text x="245" y="108" fill="#e9eef7" font-size="12">Lahore</text>

    <text x="245" y="136" fill="#00d9ff" font-size="11.5" font-weight="bold">STACK</text>
    <text x="245" y="153" fill="#e9eef7" font-size="12">PyTorch · Next.js</text>
    <text x="245" y="168" fill="#e9eef7" font-size="12">FastAPI</text>

    <text x="245" y="196" fill="#9d4edd" font-size="11.5" font-weight="bold">AI_API</text>
    <text x="245" y="213" fill="#e9eef7" font-size="12">Claude · GPT-4</text>
    <text x="245" y="228" fill="#e9eef7" font-size="12">Gemini · Groq</text>

    <line x1="26" y1="246" x2="434" y2="246" stroke="#232e42" stroke-width="1"/>

    <!-- 4 evenly-spaced badges spanning the full width, equal margins both sides -->
    <rect x="26"  y="256" width="93" height="24" rx="12" fill="#0d2b33" stroke="#00d9ff" stroke-width="1"/>
    <text x="72.5" y="272" fill="#00d9ff" font-size="10.5" text-anchor="middle" font-weight="bold">7+ PROJECTS</text>

    <rect x="131" y="256" width="93" height="24" rx="12" fill="#2b1046" stroke="#9d4edd" stroke-width="1"/>
    <text x="177.5" y="272" fill="#9d4edd" font-size="10.5" text-anchor="middle" font-weight="bold">4+ AI APIS</text>

    <rect x="236" y="256" width="93" height="24" rx="12" fill="#0a2e1a" stroke="#00ff88" stroke-width="1"/>
    <text x="282.5" y="272" fill="#00ff88" font-size="10.5" text-anchor="middle" font-weight="bold">4+ LANGS</text>

    <rect x="341" y="256" width="93" height="24" rx="12" fill="#3d0620" stroke="#ff006e" stroke-width="1"/>
    <text x="387.5" y="272" fill="#ff006e" font-size="10" text-anchor="middle" font-weight="bold">OPEN TO WORK</text>

    <!-- terminal prompt line — textLength forces this to always fit inside the box, regardless of font -->
    <text x="26" y="300" fill="#00ff88" font-size="13">&gt; whoami</text>
    <text x="26" y="320" fill="#e9eef7" font-size="12" textLength="408" lengthAdjust="spacingAndGlyphs">hussain_haider :: building AI that ships</text>
  </g>
</svg>
