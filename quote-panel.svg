<svg viewBox="0 0 640 140" xmlns="http://www.w3.org/2000/svg" font-family="'Segoe UI', Verdana, sans-serif">
  <defs>
    <linearGradient id="borderGrad2" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#9d4edd"/>
      <stop offset="50%" stop-color="#ff006e"/>
      <stop offset="100%" stop-color="#00d9ff"/>
    </linearGradient>
    <clipPath id="quoteClip">
      <rect x="6" y="11" width="628" height="123" rx="11"/>
    </clipPath>
  </defs>

  <rect x="2" y="2" width="636" height="136" rx="14" fill="none" stroke="url(#borderGrad2)" stroke-width="2"/>
  <rect x="6" y="6" width="628" height="128" rx="11" fill="#0a0e27"/>

  <g clip-path="url(#quoteClip)">
    <!-- symmetric decorative circuit lines, mirrored left/right for balance -->
    <g opacity="0.14" stroke="#9d4edd" fill="none" stroke-width="1.3">
      <path d="M 640 25 H 560 V 45 H 500">
        <animate attributeName="stroke-dasharray" values="0,300;300,0" dur="4.2s" repeatCount="indefinite"/>
      </path>
      <path d="M 0 25 H 80 V 45 H 140">
        <animate attributeName="stroke-dasharray" values="0,300;300,0" dur="4.2s" repeatCount="indefinite"/>
      </path>
      <path d="M 0 115 H 90 V 130">
        <animate attributeName="stroke-dasharray" values="0,300;300,0" dur="5.2s" repeatCount="indefinite"/>
      </path>
      <path d="M 640 115 H 550 V 130">
        <animate attributeName="stroke-dasharray" values="0,300;300,0" dur="5.2s" repeatCount="indefinite"/>
      </path>
      <circle cx="140" cy="45" r="2.2" fill="#00d9ff" stroke="none"/>
      <circle cx="500" cy="45" r="2.2" fill="#ff006e" stroke="none"/>
    </g>

    <!-- opening + closing quote marks, mirrored for balance -->
    <text x="30" y="52" fill="#9d4edd" font-size="34" font-weight="bold" opacity="0.6">&#8220;</text>
    <text x="610" y="98" fill="#9d4edd" font-size="34" font-weight="bold" opacity="0.6" text-anchor="end">&#8221;</text>

    <!-- quote centered both horizontally and vertically, equal margins on both sides -->
    <text x="320" y="62" fill="#e9eef7" font-size="15" font-style="italic" text-anchor="middle">The goal of AI is not to imitate human reasoning,</text>
    <text x="320" y="88" fill="#e9eef7" font-size="15" font-style="italic" text-anchor="middle">but to complement and extend human potential.</text>
  </g>
</svg>
